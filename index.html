else h+=`<h3>Start a mock</h3><div class="card"><div class="rs"><select id="mc">${act().flatMap(c=>sub(c).ps.map(q=>`<option value="${c}|${q[0]}">${sub(c).n} · Paper ${q[0]} (${q[3]}, ${q[4]} min)</option>`)).join('')}</select><button class="pri" data-a="mst">Start</button></div><p class="mu">Uses your next undone past paper for that paper. The timer follows the real exam length.</p></div>`;
const hs=S.mh,av=hs.length?Math.round(hs.reduce((a,x)=>a+x.tk/x.al,0)/hs.length*100):0;
return h+`<h3>History</h3>`+(hs.length?`<div class="list">${hs.map(x=>row(x.c,`${label(x.k)} <span class="mu">${sub(x.c).n}</span>`,`<span class="mu">${x.pct}% · ${x.tk}/${x.al} min${x.tk>x.al?' · over time':''}</span>`)).join('')}</div><p class="mu">You use about ${av}% of the allowed time on average.</p>`:`<div class="card mu">No mocks yet.</div>`)}
function mockTick(){const e=$('#mk');if(!e||!S.mock)return;const l=Math.round((S.mock.end-Date.now())/1e3);e.textContent=(l<0?'−':'')+fmt(Math.abs(l));e.style.color=l<0?'#ff453a':''}
let VIEW={};const PAL=['#ff2d55','#34c759','#ffcc00','#af52de','#00c7be','#a2845e'];
function rebuildView(){VIEW={};for(const c in ALL){const a=ALL[c];VIEW[c]=S.tier[c]=='c'&&a.pc?Object.assign({},a,{ps:a.pc}):a}}
function buildT(c,raw){return raw.split('\n').filter(l=>l.includes('|')).map((l,i)=>{const[n,r]=l.split('|');return{n:n.trim(),s:r.split(';').map(x=>x.trim()).filter(Boolean).map((x,j)=>({id:`${c}.${i}.${j}`,n:x}))}})}
function loadCustom(){for(const c in S.cs){const x=S.cs[c];ALL[c]={n:x.n,c:x.c,f:x.f,ps:x.ps,cs:1};T[c]=x.t?buildT(c,x.t):[]}}
function newOb(){return{sel:(S.pick||[]).slice(),tier:Object.assign({},S.tier),step:1}}
function fillDates(){act().forEach(c=>{if(S.tier[c]=='c')return;ALL[c].ps.forEach((q,i)=>{if(q[2]&&!S.dt[c+'.'+i])S.dt[c+'.'+i]=q[2]})})}
function migrate(){if(S.v<4){if(S.pick&&S.pick.length==3)S.pick=[...S.pick,'0580','0417'];if(S.pick)S.pick.forEach(c=>{ALL[c]&&ALL[c].ps.forEach((q,i)=>{if(q[2]&&!S.dt[c+'.'+i])S.dt[c+'.'+i]=q[2]})});S.v=4;save()}
rebuildView();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}
function bkBan(){const n=Object.keys(S.sc).length+Object.keys(S.tp).length;return S.pick&&n>3&&Date.now()-(S.lb||0)>14*DAY?'<div class="ban"><span>Back up your data. It lives only in this browser.</span><button data-a="ex">Back up</button></div>':''}
function regSW(){try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
function more(a,D){switch(a){
case 'pk':{const i=ob.sel.indexOf(D.c);if(i<0)ob.sel.push(D.c);else ob.sel.splice(i,1);render();return 1}
case 'ob2':ob.step=2;render();return 1;
case 'ob1':ob.step=1;render();return 1;
case 'nob':ob=null;render();return 1;
case 'chg':ob=newOb();render();return 1;
case 'go':{const pf=$('#pf')&&$('#pf').checked;S.pick=ob.sel.slice();ob.sel.forEach(c=>{const t=ob.tier[c]||'e';if((S.tier[c]||'e')!=t)for(const k in S.dt)if(k.startsWith(c+'.'))delete S.dt[k];S.tier[c]=t});rebuildView();if(pf)fillDates();S.pd=1;ob=null;save();if(ex().length)gen();render();return 1}
case 'fd':fillDates();save();render();toast('Dates filled in for Extended papers');return 1;
case 'dl':{try{S.lb=Date.now();save();const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='igcse-boards-backup-'+ds(Date.now())+'.json';document.body.appendChild(a);a.click();a.remove();toast('Backup downloaded')}catch(e){toast('Downloads aren’t available here. Use Copy text instead.')}return 1}
case 'acs':modal(`<h2>Add a subject</h2><div class="rs"><input id="cn" placeholder="Name, e.g. Geography"><input id="cc" placeholder="Syllabus code, e.g. 0460"></div><p class="mu">Papers as number:marks:minutes, separated by commas. Example: 1:60:105, 2:60:90</p><input id="cpp" placeholder="1:60:105, 2:60:90"><p class="mu">Topics are optional. One chapter per line as Chapter|topic;topic;topic</p><textarea id="ctt" placeholder="Rivers|Erosion;Deposition;Flooding"></textarea><div class="btns"><button class="pri" data-a="acs2">Add subject</button><button data-a="mc">Cancel</button></div>`);return 1;
case 'acs2':{const n=$('#cn').value.trim(),c=$('#cc').value.replace(/[^A-Za-z0-9]/g,''),ps=$('#cpp').value.split(',').map(x=>x.trim().split(':').map(y=>y.trim())).filter(a=>/^\d$/.test(a[0])&&+a[1]).map(a=>[a[0],+a[1],'','Paper '+a[0],+a[2]||90]);
if(!n||!c||!ps.length){toast('Add a name, a code and at least one paper');return 1}if(ALL[c]){toast('That code is already in use');return 1}
S.cs[c]={n,c:PAL[Object.keys(S.cs).length%PAL.length],f:n+' ('+c+')',ps,t:$('#ctt').value.trim()};loadCustom();rebuildView();if(ob)ob.sel.push(c);$('#md').close();save();render();return 1}

case 'ex':modal(`<h2>Export backup</h2><p class="mu">Copy this text and keep it safe. Attached PDFs aren’t included.</p><textarea id="bt" readonly>${esc(JSON.stringify(S))}</textarea><div class="btns"><button class="pri" data-a="dl">Download file</button><button data-a="cp">Copy text</button><button data-a="mc">Close</button></div>`);return 1;
case 'im':modal(`<h2>Import backup</h2><input type="file" id="bf" accept=".json,application/json"><textarea id="bt" placeholder="Choose a backup file, or paste its text here"></textarea><div class="btns"><button class="pri" data-a="imp">Import</button><button data-a="mc">Close</button></div>`);return 1;
case 'cp':{const t=$('#bt');S.lb=Date.now();save();t.select();try{document.execCommand('copy');toast('Copied')}catch(e){}return 1}
case 'imp':try{S=Object.assign(S,JSON.parse($('#bt').value));save();$('#md').close();applyTheme();render();toast('Backup imported')}catch(e){toast('That backup couldn’t be read')}return 1;
case 'mc':$('#md').close();return 1;
case 'help':modal(`<h2>Keyboard shortcuts</h2><p class="mu">1 Today · 2 Plan · 3 Papers · 4 Topics · 5 Cards · 6 Mock · 7 Mistakes · 8 Focus<br>N quick-add a mistake · ? this help</p><div class="btns"><button class="pri" data-a="mc">Done</button></div>`);return 1;
case 'rst':modal(`<h2>Reset all data?</h2><p class="mu">This deletes your scores, ratings, cards and plan on this device.</p><div class="btns"><button class="pri" data-a="rst2">Reset</button><button data-a="mc">Cancel</button></div>`);return 1;
case 'rst2':try{localStorage.removeItem('ig3')}catch(e){}location.reload();return 1;
case 'th':S.theme={auto:'light',light:'dark',dark:'auto'}[S.theme]||'auto';save();applyTheme();render();return 1;
case 'cu':gen();toast('Plan rebuilt with missed tasks first');return 1;
case 'mv':{const i=+D.i,x=S.plan[i];modal(`<h2>${esc(x.x)}</h2><div class="rs"><input type="date" id="mvd" value="${ds(x.t)}"><button class="pri" data-a="mvg" data-i="${i}">Move</button></div><div class="btns"><button data-a="mvt" data-i="${i}">Push a day</button><button data-a="mvx" data-i="${i}">Delete task</button><button class="gh" data-a="mc">Cancel</button></div>`);return 1}
case 'mvg':if($('#mvd').value)S.plan[+D.i].t=+new Date($('#mvd').value+'T00:00');$('#md').close();save();render();return 1;
case 'mvt':S.plan[+D.i].t=Math.max(S.plan[+D.i].t,t0())+DAY;$('#md').close();save();render();return 1;
case 'mvx':S.plan.splice(+D.i,1);$('#md').close();save();render();return 1;
case 'off':S.plan.forEach(x=>{if(x.t==+D.t&&!x.d&&!x.e)x.t+=DAY});save();render();toast('Tasks pushed to the next day');return 1;
case 'crs':CR={on:1,list:cdue().map(x=>x.id).sort(()=>Math.random()-.5),i:0,show:0};render();return 1;
case 'crw':CR.show=1;render();return 1;
case 'cre':CR.on=0;render();return 1;
case 'crg':{const x=S.cards.find(k=>k.id==CR.list[CR.i]),g=+D.g;if(g==0){x.n=0;x.due=Date.now()-1;CR.list.push(x.id)}else{x.n=(x.n||0)+g;x.due=t0()+[1,3,7,14,30,60,90][Math.min(x.n,6)]*DAY}CR.i++;CR.show=0;if(CR.i>=CR.list.length){CR.on=0;toast('Session complete')}save();render();return 1}
case 'cad':{const q=$('#cq').value.trim(),an=$('#ca').value.trim();if(!q||!an){toast('Add a front and a back');return 1}S.cards.push({id:uid(),c:cur,t:$('#ct').value,q,a:an,due:t0(),n:0});save();render();return 1}
case 'cbk':modal(`<h2>Bulk import</h2><p class="mu">One card per line, written as Front :: Back. Cards go to ${sub(cur).n}.</p><select id="bt2">${flat(cur).map(x=>`<option value="${x.id}">${x.n}</option>`).join('')}</select><textarea id="bt" placeholder="Osmosis :: Movement of water across a partially permeable membrane"></textarea><div class="btns"><button class="pri" data-a="cbi">Import</button><button data-a="mc">Cancel</button></div>`);return 1;
case 'cbi':{let n=0;$('#bt').value.split('\n').forEach(l=>{const p=l.split('::');if(p.length>1&&p[0].trim()&&p[1].trim()){S.cards.push({id:uid(),c:cur,t:$('#bt2').value,q:p[0].trim(),a:p.slice(1).join('::').trim(),due:t0(),n:0});n++}});$('#md').close();save();render();toast(n+' cards added');return 1}
case 'cdl':S.cards=S.cards.filter(x=>x.id!=D.i);save();render();return 1;
case 'mst':{const[c,p]=$('#mc').value.split('|'),k=keys(c).find(x=>x[1]==p&&!S.sc[x[0]]);if(!k){toast('Every past paper for that paper is done');return 1}const mins=sub(c).ps.find(z=>z[0]==p)[4];S.mock={k:k[0],c,p,mins,start:Date.now(),end:Date.now()+mins*6e4};save();render();return 1}
case 'mop':dk=S.mock.k;openP(D.t);return 1;
case 'mfn':S.mock.fin=1;S.mock.tk=Math.round((Date.now()-S.mock.start)/6e4);save();render();return 1;
case 'mcx':S.mock=null;save();render();return 1;
case 'msv':{const v=$('#mm').value;if(v===''){toast('Enter your marks');return 1}const m=S.mock,o=+$('#mo').value||1;S.sc[m.k]={m:+v,o,t:Date.now(),mock:1};S.mh.unshift({k:m.k,c:m.c,pct:Math.round(+v/o*100),tk:m.tk,al:m.mins});S.mock=null;save();render();toast('Result saved to past papers');return 1}
}return 0}
document.addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||!S.pick||ob||$('#md').open||$('#dg').open)return;const o=['today','plan','papers','topics','cards','mock','mistakes','focus'];
if(/^[1-8]$/.test(e.key)){tab=o[e.key-1];render()}else if(e.key=='n'||e.key=='N'){tab='mistakes';render();setTimeout(()=>{const f=$('#mr');f&&f.focus()},0);e.preventDefault()}else if(e.key=='?')more('help',{})});
const idb=()=>new Promise((r,j)=>{const q=indexedDB.open('igcse',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>r(q.result);q.onerror=j});
const fput=async(k,b)=>{const d=await idb();d.transaction('f','readwrite').objectStore('f').put(b,k)},fget=async k=>{const d=await idb();return new Promise(r=>{const q=d.transaction('f').objectStore('f').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})};
const defUrl=(k,t)=>{const[c,s,pv]=k.split('_');return `https://papers.gceguide.com/Cambridge%20IGCSE/${encodeURIComponent(sub(c).f)}/${s.slice(0,4)}/${sub(c).u||c}_${s[4]}${s.slice(2,4)}_${t}_${pv}.pdf`};
async function openP(t){const k=dk+t;if(S.fl[k]){const b=await fget(k);if(b)return window.open(URL.createObjectURL(b))}window.open(S.ln[k]||defUrl(dk,t),'_blank')}
const setR=(id,r)=>{S.tp[id]=r?{r,n:0,due:t0()+[1,2,4,8,16][r-1]*DAY}:{};S.pd=1};
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||!b.dataset.a)return;const a=b.dataset.a,D=b.dataset;
if(more(a,D)){}else if(a=='tab'){tab=D.t;render()}else if(a=='sc'||a=='tc'){cur=D.c;render()}
else if(a=='pk'){ob[D.i]=D.c;render()}else if(a=='go'){S.pick=ob;ob=null;save();gen()}else if(a=='nob'){ob=null;render()}else if(a=='chg'){ob=[...S.pick];render()}
else if(a=='cf'){setR(D.i,rOf(D.i)==+D.n?0:+D.n);save();render()}
else if(a=='rv'){const x=S.tp[D.i];if(D.ok){x.n=(x.n||0)+1;x.r=Math.min(5,x.r+1);x.due=t0()+[1,3,7,14,30,60][Math.min(x.n,5)]*DAY}else setR(D.i,Math.max(1,x.r-1));S.pd=1;save();render()}
else if(a=='dg'){dk=D.k;const x=S.sc[dk]||{};$('#dt').textContent=`${sub(dk.split('_')[0]).n} · ${dk.split('_').slice(1).join(' ')}`;$('#dm').value=x.m??'';$('#do').value=x.o||D.m;$('#dq').value=S.ln[dk+'qp']||'';$('#dk').value=S.ln[dk+'ms']||'';$('#dg').showModal()}
else if(a=='open')openP(D.t);else if(a=='att'){const f=$('#fi');f.onchange=async()=>{if(f.files[0]){await fput(dk+D.t,f.files[0]);S.fl[dk+D.t]=1;save();toast('PDF attached')}f.value=''};f.click()}
else if(a=='save'||a=='done'){const m=$('#dm').value;S.sc[dk]={m:a=='done'||m===''?'':+m,o:+$('#do').value||1,t:Date.now()};S.ln[dk+'qp']=$('#dq').value.trim();S.ln[dk+'ms']=$('#dk').value.trim();save();$('#dg').close();render()}
else if(a=='clr'){delete S.sc[dk];save();$('#dg').close();render()}else if(a=='cls')$('#dg').close();
else if(a=='ma'){const t=$('#mt').value;if(!t)return;S.mk.unshift({c:$('#ms').value,t,p:$('#mr').value,l:+$('#ml').value,r:$('#mw').value,n:$('#mn').value,f:0,t:Date.now()});if((rOf(t)||3)>2)setR(t,2);save();render()}
else if(a=='md'){S.mk.splice(D.i,1);save();render()}else if(a=='gen')gen();else if(a=='pl'){pl=!pl;render()}
else if(a=='ts'){if(P.run)P.run=false;else{P.run=true;P.end=Date.now()+P.left*1e3;P.sj=$('#fs').value}tick()}else if(a=='tr'){P.run=false;P.mode='f';P.left=S.F*60;tick()}
else if(a=='ex'){const j=JSON.stringify(S);try{await navigator.clipboard.writeText(j);alert('Backup copied to clipboard. Attached PDFs are not included.')}catch(x){prompt('Copy this backup:',j)}}
else if(a=='im'){const j=prompt('Paste backup:');try{if(j){S=Object.assign(S,JSON.parse(j));save();render()}}catch(x){alert('Invalid backup')}}});
document.addEventListener('change',e=>{const t=e.target,D=t.dataset;if(D.a=='tg'){S.tg[D.c]=+t.value;save();render();return}if(D.a=='tr'){ob.tier[D.c]=t.value;return}if(t.id=='bf'&&t.files[0]){t.files[0].text().then(x=>{$('#bt').value=x});return}
if(D.a=='dt'){S.dt[D.k]=t.value;S.pd=1;save();render()}else if(D.a=='pd'){S.plan[D.i].d=t.checked?1:0;save();render()}else if(D.a=='mf'){S.mk[D.i].f=t.checked?1:0;save();render()}
else if(t.id=='ms')fillT();else if(t.id=='hr'){S.hrs=Math.max(1,+t.value||3);S.pd=1;save()}else if(t.id=='rs'){S.rest=+t.value;S.pd=1;save()}
else if(t.id=='fm'){S.F=Math.max(1,+t.value||25);if(!P.run&&P.mode=='f')P.left=S.F*60;save()}else if(t.id=='bm'){S.B=Math.max(1,+t.value||5);save()}});
migrate();applyTheme();if(!S.pick)ob=newOb();regSW();render();
</script></body></html>
